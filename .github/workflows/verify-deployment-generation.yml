name: Verify deployment generation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Backend tests
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests --ignore=backend/tests/docker_smoke.py

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify Docker engine
        run: docker version
      - name: Build, start and HTTP-smoke every supported runtime fixture
        env:
          PYTHONPATH: backend
        run: python backend/tests/docker_smoke.py
